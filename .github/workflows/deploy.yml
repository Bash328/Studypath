name: Build and deploy to GitHub Pages

# The whole site - every HTML page, the per-career and per-university pages, the JSON
# the calculator reads, sitemap.xml, robots.txt and CNAME - is generated by
# `npm run build` from db/data/*.mjs and site/. None of that is committed (see
# .gitignore); this workflow builds it fresh on every push and publishes public/.
#
# One-time setup this workflow cannot do for you: in the repo's Settings > Pages,
# set "Source" to "GitHub Actions". After that, every push to main deploys automatically.
#
# The build and test scripts use only Node's own built-ins (node:fs, node:sqlite, ...) -
# no npm dependency is required to build or test the site, only to run `wrangler` for the
# optional Cloudflare API (see README: "Deploying").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile and no dependency the build/test scripts actually need - this just
      # keeps `wrangler` available for parity with local `npm run deploy`, and is skipped
      # if it ever fails to resolve rather than blocking the site build.
      - run: npm install --no-audit --no-fund || true

      - name: Generate db/seed.sql
        run: npm run seed:generate

      - name: Run the test suite
        run: npm test

      - name: Build the static site
        run: npm run build
        env:
          SITE_ORIGIN: https://studypath.co.za

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
