name = "studypath"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Static site + API are served by this one Worker. Assets are tried first;
# anything under /api/* falls through to the Worker script.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "pathwise"
database_id = "2cfc439e-fa19-4213-bba2-88255be8202d"

[vars]
# Used for the Worker's CORS allow-list (see src/index.js). The static site's own
# canonical/OG/sitemap URLs come from this same value via SITE_ORIGIN at build time
# (see scripts/build-pages.mjs and .github/workflows/deploy.yml), not from this file -
# the site doesn't have to be deployed through this Worker to use it.
SITE_ORIGIN = "https://studypath.co.za"
